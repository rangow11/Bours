<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر سهام</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="دفتر سهام">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر سهام">
<meta name="theme-color" content="#12160F">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var __t=localStorage.getItem('sahm_theme');if(__t==='dark'||__t==='light')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF0EA; --surface:#F8F9F4; --surface-2:#E4E7DD; --ink:#1B2119; --ink-soft:#54594E;
  --line:#D6DACB; --accent:#B5762C; --accent-ink:#5A3814; --accent-soft:#EFDDBE;
  --pos:#2E7D4F; --pos-soft:#DCEEE1; --neg:#B23A2E; --neg-soft:#F6DEDA;
  --font:'Vazirmatn',system-ui,sans-serif;
  --radius:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#181D14; --surface-2:#20261A; --ink:#EDEAE0; --ink-soft:#A3A896;
    --line:#2C3323; --accent:#D79A4C; --accent-ink:#F3DFB8; --accent-soft:#3A2E17;
    --pos:#4CA772; --pos-soft:#1B3226; --neg:#D9604C; --neg-soft:#3A2019;
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#181D14; --surface-2:#20261A; --ink:#EDEAE0; --ink-soft:#A3A896;
  --line:#2C3323; --accent:#D79A4C; --accent-ink:#F3DFB8; --accent-soft:#3A2E17;
  --pos:#4CA772; --pos-soft:#1B3226; --neg:#D9604C; --neg-soft:#3A2019;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:var(--safe-t);}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:var(--font); color:inherit;}
input,select,textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; font-size:15px; width:100%; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.num{font-variant-numeric:tabular-nums; direction:ltr; text-align:right; unicode-bidi:plaio;}
button{cursor:pointer; border:none; font-size:15px;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* App shell */
#topbar{
  position:sticky; top:0; z-index:20; padding-top:var(--safe-t);
  background:var(--bg); border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 16px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--surface);font-weight:800;font-size:15px;}
.brand-name{font-weight:700; font-size:16px; letter-spacing:-.01em;}
.icon-btn{width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
#themeBtn svg{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#themeBtn .i-sun{display:none;} #themeBtn .i-moon{display:block;}
:root[data-theme="dark"] #themeBtn .i-sun{display:block;} :root[data-theme="dark"] #themeBtn .i-moon{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #themeBtn .i-sun{display:block;} :root:not([data-theme="light"]) #themeBtn .i-moon{display:none;}
}
.dash-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.dash-tab{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 8px;text-align:center;min-width:0;color:var(--ink);}
.dash-tab .lbl{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
.dash-tab .val{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-word;}
.dash-tab.main{background:var(--accent-soft);border-color:var(--accent);}
.dash-tab.main .val{color:var(--accent-ink);}
.dash-tab:active{transform:scale(.98);}
.jcal-today{margin-top:10px;display:flex;gap:8px;}

main{max-width:920px; margin:0 auto; padding:16px 16px calc(84px + var(--safe-b)); min-height:70vh;}

/* professional Other menu */
.other-menu{display:grid;gap:10px;}
.other-menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:right;padding:15px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.05);cursor:pointer;}
.other-menu-item:active{transform:scale(.99);}
.other-menu-item b{font-size:14px;color:var(--ink);}
.other-menu-item .hint{margin-top:4px;color:var(--ink-soft);}

/* bottom nav */
#navbar{
  position:fixed; bottom:0; right:0; left:0; z-index:30; padding-bottom:var(--safe-b);
  background:var(--surface); border-top:1px solid var(--line);
}
.nav-inner{max-width:920px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr);}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px 7px; background:transparent; color:var(--ink-soft); font-size:11px; min-width:0; touch-action:manipulation;}
.nav-item svg{width:20px;height:20px;stroke:currentColor; fill:none; stroke-width:1.8;}
.nav-item.active{color:var(--accent);}
.nav-item.active svg{stroke:var(--accent);}
html,body{overscroll-behavior-y:none;}
#pullRefresh{position:fixed;top:calc(8px + var(--safe-t));left:50%;transform:translate(-50%,-70px);width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 5px 18px rgba(0,0,0,.14);z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .22s ease,opacity .22s ease;opacity:0;}
#pullRefresh.show{transform:translate(-50%,0);opacity:1;}
#pullRefresh .dots{width:24px;height:24px;position:relative;}
#pullRefresh i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);left:9px;top:9px;}
#pullRefresh i:nth-child(1){transform:translateY(-8px);}
#pullRefresh i:nth-child(2){transform:translateX(8px);}
#pullRefresh i:nth-child(3){transform:translateY(8px);}
#pullRefresh i:nth-child(4){transform:translateX(-8px);}
#pullRefresh.spin .dots{animation:pullSpin .65s linear infinite;}
@keyframes pullSpin{to{transform:rotate(360deg);}}
/* professional mobile navigation / page motion */
#navbar{bottom:0; transform:translate3d(0,0,0); will-change:transform; backface-visibility:hidden;}
body{overscroll-behavior-y:none;}
#app{will-change:transform,opacity;}
#app.view-enter-from-right{animation:viewEnterFromRight .24s cubic-bezier(.22,.75,.25,1) both;}
#app.view-enter-from-left{animation:viewEnterFromLeft .24s cubic-bezier(.22,.75,.25,1) both;}
@keyframes viewEnterFromRight{from{opacity:.35;transform:translate3d(26px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes viewEnterFromLeft{from{opacity:.35;transform:translate3d(-26px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.swipe-hint{touch-action:pan-y;}
@media(max-width:520px){.nav-item{font-size:10.5px;padding-top:7px;padding-bottom:6px}.nav-item svg{width:19px;height:19px}}


/* sections */
.section-title{font-size:13px; color:var(--ink-soft); margin:22px 0 10px; font-weight:600;}
.section-title:first-child{margin-top:0;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.row{display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row:active{background:var(--surface-2);}

/* stat grid */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
.stat .lbl{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
.stat .val{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;}
.stat .val.pos{color:var(--pos);} .stat .val.neg{color:var(--neg);}

.pill{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
.pill.pos{background:var(--pos-soft); color:var(--pos);}
.pill.neg{background:var(--neg-soft); color:var(--neg);}
.pill.muted{background:var(--surface-2); color:var(--ink-soft);}
.pill.accent{background:var(--accent-soft); color:var(--accent-ink);}

.btn{padding:11px 16px; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; font-size:14.5px;}
.btn.block{width:100%;}
.btn.secondary{background:var(--surface-2); color:var(--ink);}
.btn.ghost{background:transparent; color:var(--accent); padding:8px 10px;}
.btn.danger{background:var(--neg-soft); color:var(--neg);}
.btn.sm{padding:7px 12px; font-size:13px; border-radius:7px;}
.btn:disabled{opacity:.45;}

.fab{position:fixed; left:16px; bottom:calc(78px + var(--safe-b)); z-index:25; width:52px;height:52px;border-radius:16px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.22);}
.fab svg{width:24px;height:24px;stroke:#fff; fill:none; stroke-width:2;}

.empty{padding:40px 16px; text-align:center; color:var(--ink-soft);}
.empty svg{width:34px;height:34px;stroke:var(--ink-soft); margin-bottom:10px;}
.empty .t{font-size:14.5px; font-weight:600; color:var(--ink); margin-bottom:4px;}
.empty .d{font-size:13px; line-height:1.9;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px; line-height:1.7;}
.field-row{display:flex; gap:10px;}
.field-row>.field{flex:1;}
.checkline{display:flex; align-items:center; gap:8px;}
.checkline input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--accent);}

/* modal / sheet */
.overlay{position:fixed; inset:0; background:rgba(10,12,8,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow:auto;
  border-radius:18px 18px 0 0; padding:18px 18px calc(24px + var(--safe-b));
}
@media (min-width:640px){ .overlay{align-items:center;} .sheet{border-radius:16px; max-height:88vh;} }
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:sticky; top:0; background:var(--bg); padding-top:2px;}
.sheet-head h2{font-size:17px; margin:0; font-weight:700;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{font-size:11.5px; color:var(--ink-soft); text-align:right; padding:6px 6px; font-weight:600; border-bottom:1px solid var(--line);}
td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.qty-input{width:64px; padding:6px 7px; font-size:13.5px;}
.price-input{width:96px; padding:6px 7px; font-size:13.5px;}

.mask-toggle{background:none;border:none;color:var(--accent);font-size:12px;padding:2px 4px;}

.search-bar{display:flex; gap:8px; margin-bottom:14px;}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;}
.chip{white-space:nowrap; padding:7px 13px; border-radius:20px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; color:var(--ink-soft);}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
:root[data-theme="dark"] .chip.active, :root:not([data-theme="light"]) .chip.active{ }
@media (prefers-color-scheme:dark){ .chip.active{background:var(--accent); color:#1b1204; border-color:var(--accent);} }
:root[data-theme="dark"] .chip.active{background:var(--accent); color:#1b1204; border-color:var(--accent);}

.toast{position:fixed; bottom:calc(90px + var(--safe-b)); right:50%; transform:translateX(50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13.5px; z-index:80;}

.person-tag{display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:var(--surface);}
.person-tag .name{font-weight:600; font-size:13.5px;}
.person-tag .sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.banner{padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.9; margin-bottom:14px; display:flex; gap:10px; align-items:flex-start;}
.banner.info{background:var(--accent-soft); color:var(--accent-ink);}
.banner svg{width:17px;height:17px;flex:none;margin-top:2px;}

.api-status{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.7;}
.symbol-match{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:7px;font-size:12px;line-height:1.8;}
.symbol-match.ok{border-color:var(--pos);background:var(--pos-soft);}
.symbol-match.warn{border-color:var(--accent);background:var(--accent-soft);}
.alert-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.sale-alert-group{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;z-index:3;white-space:nowrap;} .sale-alert-group .pill{display:inline-flex;align-items:center;gap:4px;}
.alert-mini{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:11.5px;line-height:1.8;}
.refresh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 10px;}
@media(max-width:420px){.alert-grid{grid-template-columns:1fr;}}

.jalali-date{cursor:pointer;background:var(--surface)!important;}
.jalali-picker{position:fixed;z-index:200;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:16px;}
.jcal{width:min(360px,100%);background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;}
.jcal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.jcal-title{font-weight:800;font-size:15px;text-align:center;flex:1;}
.jcal-nav{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;}
.jcal-week,.jcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.jcal-week div{text-align:center;color:var(--ink-soft);font-size:11px;padding:5px 0;font-weight:700;}
.jcal-day{border:1px solid transparent;background:var(--surface);border-radius:9px;min-height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;}
.jcal-day:hover{border-color:var(--accent);}.jcal-day.today{border-color:var(--accent);}.jcal-day.selected{background:var(--accent);color:var(--accent-ink);font-weight:800;}
.backup-card{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:9px;}
.backup-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;color:var(--accent-ink);font-weight:800;}
.cash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.cash-summary .stat{min-width:0;}
.copy-card-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;cursor:pointer;color:var(--accent-ink);}
@media(max-width:520px){.cash-summary{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-mark">دس</div><div class="brand-name">دفتر سهام</div></div>
    <div class="topbar-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="تغییر حالت روز / شب" title="حالت روز / شب">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
    <button class="icon-btn" onclick="openSettings()" aria-label="تنظیمات">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
    </button>
    </div>
  </div>
</div>

<main id="app"></main>
<div id="pullRefresh" aria-hidden="true"><div class="dots"><i></i><i></i><i></i><i></i></div></div>

<button class="fab" id="fabBtn" onclick="fabAction()" aria-label="ثبت جدید">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<div id="navbar">
  <div class="nav-inner">
    <button class="nav-item" data-view="dashboard" onclick="setView('dashboard')">
      <span class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"></path></svg><span id="saleAlertBadge" class="nav-badge" style="display:none"></span></span>داشبورد</button>
    <button class="nav-item" data-view="people" onclick="setView('people')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"></path></svg>اشخاص</button>
    <button class="nav-item" data-view="shares" onclick="setView('shares')">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"></path></svg>عرضه اولیه‌ها</button>
    <button class="nav-item" data-view="other" onclick="setView('other')">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>سایر</button>
  </div>
</div>

<script>
/* ---------------- utilities ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid4 = ()=>Math.random().toString(36).slice(2,10);
const fmtNum = n => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(Number(n)).toLocaleString('en-US');
const fmtToman = n => fmtNum(n) + ' ریال';
// کارمزد ثابت معاملات بورس؛ برای ارزش روز فقط کارمزد فروش کسر می‌شود و قیمت خام API دست‌کاری نمی‌شود.
const BUY_FEE_RATE = 0.003712;
const SELL_FEE_RATE = 0.0088;

function normalizeFa(s){
  return (s||'').toString().trim()
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
    .replace(/[\u200c\u200d]/g,'').replace(/\s+/g,'')
    .toLowerCase();
}
function normalizeDigits(s){
  return String(s||'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
}
function cleanInsCode(s){ return normalizeDigits(s).replace(/[^0-9]/g,''); }
// جستجوی آنلاین برای نمادهایی که در SYMBOL_CATALOG قدیمی نیستند.
// اول از BRS API تنظیم‌شده در برنامه استفاده می‌کنیم؛ اگر در دسترس نبود، TSETMC را امتحان می‌کنیم.
function rowSymbol(r){
  const id = r?.id ?? r?.insCode ?? r?.InsCode ?? r?.instrumentCode;
  const l18 = r?.l18 ?? r?.lVal18AFC ?? r?.LVal18AFC ?? r?.symbol ?? r?.Symbol;
  const l30 = r?.l30 ?? r?.lVal30 ?? r?.LVal30 ?? r?.name ?? r?.Name ?? '';
  if(id==null || !l18) return null;
  return {id:String(id), l18:String(l18), l30:String(l30), raw:r};
}
function extractRows(raw){
  const rows=Array.isArray(raw)?raw:(raw?.data||raw?.result||raw?.symbols||raw?.marketwatch||raw?.instrumentSearch||[]);
  return Array.isArray(rows)?rows.map(rowSymbol).filter(Boolean):[];
}




function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

  }catch(e){ console.error('load failed', e); }

function saveLocal(){

/** add/update/delete against S[type], persisting to localStorage after each change. */
function addRecord(type, data){
  const rec = Object.assign({id: uid4()+Date.now().toString(36)}, data);
  S[type].push(rec); saveLocal(); render();
  return rec;
}
function updateRecord(type, id, patch){
  const idx = S[type].findIndex(x=>x.id===id);
  if(idx<0) return;
  S[type][idx] = Object.assign({}, S[type][idx], patch);
  saveLocal(); render();
}
function deleteRecord(type, id){
  S[type] = S[type].filter(x=>x.id!==id);
  saveLocal(); render();
}

function init(){
  const data = loadLocal();
  S.people = data.people||[]; S.shares = data.shares||[];
  S.purchases = data.purchases||[]; S.sales = data.sales||[]; S.cashTransactions = data.cashTransactions||[];
  S.apiKey = data.apiKey || '';
  S.autoRefreshMin = Number(data.autoRefreshMin)||0;
  S.apiEndpoint = data.apiEndpoint || 'https://Api.BrsApi.ir/Tsetmc/AllSymbols.php';
  S.shares.forEach(sh=>{
    if(sh.profitAlertPct==null) sh.profitAlertPct = 0;
    if(sh.volumeAlertPct==null) sh.volumeAlertPct = 0;
  });
  S.ready = true;
  saveLocal();
  render();
}

function personById(id){ return S.people.find(p=>p.id===id); }
function shareById(id){ return S.shares.find(s=>s.id===id); }

function openPurchasesForShare(shareId){
  return S.purchases.filter(p=>p.shareId===shareId && p.status==='open');
}
function purchasesForPerson(personId){
  return S.purchases.filter(p=>p.personId===personId);
}
function purchasesForShare(shareId){
  return S.purchases.filter(p=>p.shareId===shareId);
}

function shareStats(shareId){
  const purchases = purchasesForShare(shareId);
  let invested=0, openQty=0, openCost=0, soldQty=0, soldCost=0, revenue=0;
  purchases.forEach(p=>{
    const cost = buyCostWithFee(p.quantity*p.unitPrice);
    invested += cost;
    if(p.status==='open'){ openQty+=p.quantity; openCost+=cost; }
  });
  S.sales.filter(s=>s.shareId===shareId).forEach(s=>{
    soldQty += s.quantity; soldCost += buyCostWithFee(s.quantity*s.buyPrice); revenue += netSellValue(s.quantity*s.salePrice);
  });
  const profit = revenue - soldCost;
  const profitPct = soldCost>0 ? (profit/soldCost*100) : 0;
  return {invested, openQty, openCost, soldQty, soldCost, revenue, profit, profitPct};
}

function overallStats(){
  let invested=0, revenue=0, soldCost=0, openCost=0;
  S.purchases.forEach(p=>{ const c=buyCostWithFee(p.quantity*p.unitPrice); invested+=c; if(p.status==='open') openCost+=c; });
  S.sales.forEach(s=>{ revenue += netSellValue(s.quantity*s.salePrice); soldCost += buyCostWithFee(s.quantity*s.buyPrice); });
  const profit = revenue - soldCost;
  const profitPct = soldCost>0 ? (profit/soldCost*100) : 0;
  return {invested, revenue, soldCost, openCost, profit, profitPct, shareCount:S.shares.length, peopleCount:S.people.length};
}

function animateView(direction){
  const app=$('#app'); if(!app||!direction) return;

  app.classList.add(direction==='next'?'view-enter-from-right':'view-enter-from-left');

function setView(v, opts={}){
  if(v===S.view && !opts.force) return;
  const oldTab=activeTabView();
  const newTab=['cash','history','reports'].includes(v)?'other':v;
  const oi=TAB_ORDER.indexOf(oldTab), ni=TAB_ORDER.indexOf(newTab);
  const direction=opts.direction || (ni>oi || (oi===TAB_ORDER.length-1 && ni===0) ? 'next' : 'prev');
  if($('#ovSheet')){ closeSheet(true); if(NAV_READY) history.replaceState({sahm:true,view:S.view},'',location.href); }
  S.expandedShareId=null; S.view=v;
  if(NAV_READY && !opts.fromPop && !opts.skipHistory){ history.pushState({sahm:true,view:v},'',location.href); }
  render(); window.scrollTo({top:0,behavior:'auto'}); animateView(direction);
}
function navigateTab(delta){
  const cur=activeTabView(), idx=TAB_ORDER.indexOf(cur);
  const ni=(idx+delta+TAB_ORDER.length)%TAB_ORDER.length;
  setView(TAB_ORDER[ni],{direction:delta>0?'next':'prev'});

/* ---------------- CUSTOM PULL TO REFRESH ---------------- */
let PULL={x:0,y:0,active:false,triggered:false};
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1 || $('#ovSheet') || $('#jalaliPicker')) return;
  const p=e.touches[0];
  if(window.scrollY<=0 && document.documentElement.scrollTop<=0 && document.body.scrollTop<=0 && !e.target.closest('input,textarea,select,button,a,[contenteditable="true"]')) PULL={x:p.clientX,y:p.clientY,active:true,triggered:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!PULL.active) return;
  const p=e.touches[0], dy=p.clientY-PULL.y;
  if(dy<=0){PULL.active=false;return;}
  const el=$('#pullRefresh'); if(!el)return;
  const progress=Math.min(1,dy/80);
  el.style.transform=`translate(-50%,${(-70+70*progress)}px)`;
  el.style.opacity=String(.15+.85*progress);
  if(dy>=60){el.classList.add('show');PULL.triggered=true;}
},{passive:true});
document.addEventListener('touchend',async()=>{
  if(!PULL.active)return;
  const el=$('#pullRefresh'); PULL.active=false;
  if(PULL.triggered){
    el.classList.add('show','spin'); el.style.transform='translate(-50%,0)'; el.style.opacity='1';
    try{ await refreshPrices(); }finally{setTimeout(()=>{el.classList.remove('show','spin');el.style.transform='translate(-50%,-70px)';el.style.opacity='0';},280);}
  }else{el.classList.remove('show');el.style.transform='translate(-50%,-70px)';el.style.opacity='0';}
},{passive:true});

function shareAlertInfo(sh){
  const opens=openPurchasesForShare(sh.id);
  const cost=opens.reduce((a,p)=>a+p.quantity*p.unitPrice,0);
  const qty=opens.reduce((a,p)=>a+p.quantity,0);
  const avgCost=qty>0 ? cost/qty : null;
  const price=Number(sh.currentPrice)||null;
  const profitPct=(price!=null && avgCost>0) ? ((price/avgCost)-1)*100 : null;
  const volume=Number(sh.marketVolume)||0;
  const queue=Number(sh.buyQueueVolume)||0;
  const queuePrice=Number(sh.buyQueuePrice)||0;
  const upperLimit=Number(sh.upperLimit)||0;
  const hasBuyQueue=opens.length>0 && queue>0 && queuePrice>0 && upperLimit>0 && queuePrice>=upperLimit;
  const volumeToQueuePct=hasBuyQueue ? (volume/queue)*100 : null;
  const hasOpen=opens.length>0; // سهم کاملاً فروخته‌شده هیچ‌وقت هشدار نمی‌دهد
  const queueHit=hasOpen && sh.queueBreakAlert!==false && !!sh.queueBroken;
  const profitHit=hasOpen && Number(sh.profitAlertPct)>0 && profitPct!=null && profitPct>=Number(sh.profitAlertPct);
  const volumeHit=hasOpen && Number(sh.volumeAlertPct)>0 && volumeToQueuePct!=null && volumeToQueuePct>=Number(sh.volumeAlertPct);
  return {avgCost,profitPct,volumeToQueuePct,profitHit,volumeHit,queueHit,volume,queue};
}
function alertLabel(sh){
  const a=shareAlertInfo(sh);
  const n=[a.profitHit,a.volumeHit,a.queueHit].filter(Boolean).length;
  if(n>=2) return 'چند هشدار فروش';
  if(a.queueHit) return 'صف خرید شکست';
  if(n===1) return 'هشدار فروش';
  return '';
}
function saleAlertShares(){ return S.shares.filter(sh=>{const a=shareAlertInfo(sh);return a.profitHit||a.volumeHit||a.queueHit;}); }
// هر هشدار یک کلید دارد تا فقط هشدارِ تازه نوتیف بدهد.
function alertItems(){

}

async function showAppNotification(title, body){
  const opts={body,tag:'sahm-sale-alert',renotify:true,icon:'icon-192.png',badge:'icon-192.png',dir:'rtl',lang:'fa'};
  try{ // اندروید فقط از طریق Service Worker اعلان می‌دهد
    if('serviceWorker' in navigator){
      const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),1500))]);
      if(reg){ await reg.showNotification(title,opts); return true; }
    }
  }catch(e){}
  try{ new Notification(title,opts); return true; }catch(e){ return false; }
}
async function requestSaleNotifications(){
  if(!('Notification' in window)){ toast('این مرورگر از اعلان پشتیبانی نمی‌کند'); return; }
  if(Notification.permission==='denied'){ toast('اعلان‌ها مسدود شده‌اند؛ از تنظیمات مرورگر فعالشان کنید'); return; }
  if(Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted'){ toast('اجازه اعلان داده نشد'); return; }
  }
  const ok=await showAppNotification('دفتر سهام','اعلان‌ها فعال شد ✓');
  toast(ok?'اعلان‌ها فعال شد':'اجازه داده شد ولی نمایش اعلان ناموفق بود؛ برنامه را نصب (PWA) کنید');
  if($('#st_notif_status')) $('#st_notif_status').textContent=notifStatusText();
}
async function notifySaleAlerts(items){
  if(!items.length || !('Notification' in window) || Notification.permission!=='granted') return;
  const label={p:'به حد سود رسید',v:'نسبت حجم به صف به حد هشدار رسید',q:'صف خرید شکست'};
  await showAppNotification('هشدار فروش سهام', items.map(x=>`${x.sh.name||'نماد'}: ${label[x.type]}`).join('\n'));
}

let AUTO_TIMER=null, REFRESHING=false, LAST_REFRESH=0;
function setupAutoRefresh(){
  clearInterval(AUTO_TIMER); AUTO_TIMER=null;
  const m=Number(S.autoRefreshMin)||0; if(!m) return;
  AUTO_TIMER=setInterval(()=>{ if(!document.hidden && S.apiKey) refreshPrices({silent:true}); }, m*60000);
}
document.addEventListener('visibilitychange',()=>{
  const m=Number(S.autoRefreshMin)||0;
  if(!document.hidden && m && S.apiKey && Date.now()-LAST_REFRESH>m*60000) refreshPrices({silent:true});
});

/* ---------------- BRS API (فقط بورس و فرابورس: type=1) ---------------- */
const BRS_TYPE = 1;
const BRS_DEFAULT_ENDPOINT = 'https://Api.BrsApi.ir/Tsetmc/AllSymbols.php';
function brsListUrl(){
  const endpoint=(S.apiEndpoint||BRS_DEFAULT_ENDPOINT).trim();
  const sep=endpoint.includes('?')?'&':'?';
  return endpoint+sep+'key='+encodeURIComponent(S.apiKey)+'&type='+BRS_TYPE;
}
function parsePrice(v){
  const n=Number(normalizeDigits(v).replace(/[^0-9.]/g,''));
  return Number.isFinite(n)&&n>0 ? n : null;
}
// قیمت زنده فقط اگر واقعاً مثبت باشد؛ نماد بسته/متوقف قیمت صفر یا خالی دارد و نباید قیمت دستی را خراب کند.
function pickLivePrice(r){
  for(const k of ['pl','pc','pf']){ const v=Number(r?.[k]); if(Number.isFinite(v)&&v>0) return v; }
  return null;
}

async function refreshPrices(opts={}){
  const silent=!!opts.silent; const say=m=>{ if(!silent) toast(m); };
  if(REFRESHING) return;
  if(!S.apiKey){ say('اول توکن BRS API را در تنظیمات وارد کنید'); return; }
  const openShares=S.shares.filter(sh=>openPurchasesForShare(sh.id).length>0);
  if(!openShares.length){ say('موقعیت باز برای بروزرسانی وجود ندارد'); return; }
  const beforeKeys=new Set(alertItems().map(x=>x.key));
  REFRESHING=true;
  say('در حال دریافت قیمت‌ها…');
  try{
    const res=await fetch(brsListUrl(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=extractRows(await res.json());
    if(!rows.length) throw new Error('هیچ نمادی از API دریافت نشد');
    const byId=new Map(), byName=new Map();
    rows.forEach(x=>{
      byId.set(String(x.id),x);
      const k=normalizeFa(x.l18); if(!k) return;
      if(!byName.has(k)) byName.set(k,[]);
      byName.get(k).push(x);
    });
    let updated=0, kept=0;
    const now=Date.now();
    for(const sh of openShares){
      // اول شناسه‌ی قدیمی (اگر از نسخه‌های قبل مانده)، بعد نام دقیق نماد. پیدا نشد = قیمت قبلی/دستی می‌ماند.
      const idKey=cleanInsCode(sh.symbolId);
      let cands=[];
      if(idKey && byId.has(idKey)) cands=[byId.get(idKey)];
      if(!cands.length) cands=byName.get(normalizeFa(sh.name)) || [];
      if(!cands.length && sh.symbolCode) cands=byName.get(normalizeFa(sh.symbolCode)) || [];
      let r=null, price=null;
      for(const c of cands){ const pr=pickLivePrice(c.raw||c); if(pr){ r=c; price=pr; break; } }
      if(!r){ kept++; continue; }
      const raw=r.raw||r;
      sh.currentPrice=price;
      sh.priceSource='api';
      sh.marketVolume=Number(raw.tvol)||0;        // حجم معاملات امروز
      sh.buyQueueVolume=Number(raw.qd1)||0;       // حجم سطر اول خرید
      sh.buyQueuePrice=Number(raw.pd1)||0;        // قیمت سطر اول خرید
      sh.upperLimit=Number(raw.tmax)||0;          // آستانه مجاز بالا
      sh.lastPriceChangePct=Number(raw.plp ?? raw.pcp)||0;
      sh.lastApiUpdate=now;
      // شکستن صف: قبلاً در صف خرید (قیمت خرید سطر اول ≥ آستانه بالا) بوده و حالا سفارش خرید پایین‌تر از سقف است.
      // اگر تابلو کاملاً خالی باشد (مثلاً بعد از بسته شدن بازار) شکست حساب نمی‌شود و وضعیت قبلی می‌ماند.
      const pd1=Number(raw.pd1)||0, qd1=Number(raw.qd1)||0, tmax=Number(raw.tmax)||0;
      const nowInQueue = qd1>0 && pd1>0 && tmax>0 && pd1>=tmax;
      const bookEmpty = pd1===0 && qd1===0;
      if(nowInQueue){ sh.inQueue=true; sh.queueBroken=false; }
      else if(!bookEmpty){
        if(sh.inQueue){ sh.queueBroken=true; sh.queueBrokenAt=now; }
        sh.inQueue=false;
      }
      updated++;
    }
    saveLocal(); render();
    LAST_REFRESH=Date.now();
    const alertShares=saleAlertShares();
    const newItems=alertItems().filter(x=>!beforeKeys.has(x.key));
    if(newItems.length) notifySaleAlerts(newItems);
    say(`${updated} سهم بروزرسانی شد${kept?' · '+kept+' سهم با قیمت قبلی/دستی ماند':''}${alertShares.length?' · '+alertShares.length+' هشدار فروش':''}`);
  }catch(e){
    console.error('BRS API update failed',e);
    say('دریافت قیمت ناموفق بود؛ توکن، دسترسی شبکه یا CORS را بررسی کنید');
  }finally{ REFRESHING=false; }
}

function portfolioList(){
  return S.shares.map(sh=>{
    const opens = S.purchases.filter(p=>p.shareId===sh.id && p.status==='open');
    if(!opens.length) return null;
    const holderIds = [...new Set(opens.map(p=>p.personId))];
    const cost = opens.reduce((a,p)=>a+buyCostWithFee(p.quantity*p.unitPrice),0);
    const qty = opens.reduce((a,p)=>a+p.quantity,0);
    const hasPrice = sh.currentPrice!=null && sh.currentPrice!=='';
    const value = hasPrice ? netSellValue(qty*sh.currentPrice) : null;
    const profit = hasPrice ? value-cost : null;
    const profitPct = (hasPrice && cost>0) ? (profit/cost*100) : null;
    return {share:sh, holderIds, cost, qty, value, profit, profitPct, opens};
  }).filter(Boolean).sort((a,b)=> (b.profit==null?-Infinity:b.profit) - (a.profit==null?-Infinity:a.profit));
}

function monthKey(ts){
  if(!ts) return '';
  const d=new Date(ts); const j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${j[0]}-${String(j[1]).padStart(2,'0')}`;
}
function currentJalaliMonthKey(){ return monthKey(Date.now()); }
function monthLabel(key){
  const [y,m]=String(key||'').split('-').map(Number);
  return y&&m ? `${JMONTHS[m-1]} ${y}` : '—';
}
function statsForPeriod(key){
  const all=!key || key==='all';
  let invested=0,revenue=0,soldCost=0,openCost=0;
  S.purchases.forEach(p=>{
    if(all || monthKey(p.date)===key){
      const c=buyCostWithFee(Number(p.quantity||0)*Number(p.unitPrice||0)); invested+=c;
      if(p.status==='open' && (all || monthKey(Date.now())===key)) openCost+=c;
    }
  });
  S.sales.forEach(s=>{
    if(all || monthKey(s.date)===key){ revenue+=netSellValue(Number(s.quantity||0)*Number(s.salePrice||0)); soldCost+=buyCostWithFee(Number(s.quantity||0)*Number(s.buyPrice||0)); }
  });
  const profit=revenue-soldCost;
  const profitPct=soldCost>0?profit/soldCost*100:0;
  return {invested,revenue,soldCost,openCost,profit,profitPct};
}
function availableReportMonths(){
  const set=new Set();
  S.purchases.forEach(x=>{const k=monthKey(x.date);if(k)set.add(k);});
  S.sales.forEach(x=>{const k=monthKey(x.date);if(k)set.add(k);});
  const cur=currentJalaliMonthKey(); if(cur)set.add(cur);
  return [...set].sort((a,b)=>a.localeCompare(b));
}

/* سود/زیان فروش‌نرفته (موقعیت‌های باز با قیمت فعلی، بعد از کارمزد فروش) */
function unrealizedStats(){
  let costAll=0,cost=0,value=0,count=0; const missingNames=[];
  portfolioList().forEach(it=>{
    count++; costAll+=it.cost;
    if(it.value==null){ missingNames.push(it.share.name); return; }
    cost+=it.cost; value+=it.value;
  });
  const profit=value-cost, pct=cost>0?profit/cost*100:0;
  return {costAll,cost,value,profit,pct,missing:missingNames.length,missingNames,count};
}
function renderUnrealizedBlock(){
  const u=unrealizedStats();
  if(!u.count) return `<div class="section-title">سود فروش‌نرفته (سهام فعلی)</div>${emptyBlock('سهام بازی وجود ندارد','بعد از ثبت خرید، سود و زیان لحظه‌ای سهام اینجا نشان داده می‌شود.')}`;
  const cls=u.profit>=0?'pos':'neg';
  return `<div class="section-title">سود فروش‌نرفته (سهام فعلی)</div>
    <div class="stats">
      <div class="stat"><div class="lbl">سود / زیان فعلی سهام</div><div class="val ${cls}">${fmtToman(u.profit)}</div></div>
      <div class="stat"><div class="lbl">درصد سود / زیان فعلی</div><div class="val ${cls}">${u.pct.toFixed(1)}٪</div></div>
      <div class="stat"><div class="lbl">هزینه خرید سهام فعلی</div><div class="val">${fmtToman(u.costAll)}</div></div>
      <div class="stat"><div class="lbl">ارزش فعلی ${u.missing?'(فقط سهام دارای قیمت)':'(پس از کارمزد فروش)'}</div><div class="val">${fmtToman(u.value)}</div></div>

    ${u.missing?`<div class="hint" style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.8;">قیمت فعلی این سهم مشخص نیست: <b>${u.missingNames.map(escapeHtml).join('، ')}</b>. هزینه خرید آن در کارت «هزینه خرید» آمده، ولی سود، درصد و ارزش فعلی فقط روی سهامی حساب شده که قیمت دارند (هزینه آن‌ها ${fmtToman(u.cost)}). با «بروزرسانی قیمت‌ها» یا ثبت قیمت دستی کامل می‌شود.</div>`:''}`;

function maskNid(nid){
  if(!nid) return '—';
  if(S.revealSensitive) return nid;
  return nid.slice(0,3)+'••••'+nid.slice(-2);
}

function savePerson(id){

function saveShare(id){
  const name=$('#f_sname').value.trim();
  if(!name){toast('نام عرضه اولیه را وارد کنید');return;}
  const old=id?shareById(id):null;
  const manual=parsePrice($('#f_price').value);
  const data={name,profitAlertPct:Number($('#f_profit_alert').value)||0,volumeAlertPct:Number($('#f_volume_alert').value)||0,queueBreakAlert:$('#f_queue_alert').checked,notes:$('#f_snotes').value.trim(),updatedAt:Date.now()};
  if(old){
    if(old.name!==name){ data.symbolId=''; data.symbolCode=''; data.companyName=''; } // نام عوض شد؛ شناسه‌ی قدیمی معتبر نیست
    if(manual==null){ data.currentPrice=null; data.priceSource=null; }
    else if(manual!==Number(old.currentPrice)){ data.currentPrice=manual; data.priceSource='manual'; }
    updateRecord('shares',id,data);
  }else{
    Object.assign(data,{symbolId:'',symbolCode:'',companyName:'',currentPrice:manual,priceSource:manual?'manual':null,marketVolume:0,buyQueueVolume:0,createdAt:Date.now()});
    addRecord('shares',data);
  }
  closeSheet();toast('ذخیره شد');
}

function tsToIso(ts){ const d=new Date(ts||Date.now()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function isoToTs(iso){ const t=new Date(String(iso||'')+'T12:00:00').getTime(); return isNaN(t)?Date.now():t; }
function applyMasterToRows(){

}

function submitBuy(){
  let shareId=$('#b_share').value;
  const date=isoToTs($('#b_date').value);
  const profitAlertPct=Number($('#b_profit_alert').value)||0;
  const volumeAlertPct=Number($('#b_volume_alert').value)||0;
  const queueBreakAlert=$('#b_queue_alert').checked;
  if(shareId==='__new__'){
    const name=$('#b_newshare_name').value.trim();
    if(!name){toast('نام عرضه اولیه جدید را وارد کنید');return;}
    const manual=parsePrice($('#b_newshare_price').value);
    const rec=addRecord('shares',{name,symbolId:'',symbolCode:'',companyName:'',currentPrice:manual,priceSource:manual?'manual':null,profitAlertPct,volumeAlertPct,queueBreakAlert,marketVolume:0,buyQueueVolume:0,notes:'',createdAt:Date.now(),updatedAt:Date.now()});
    shareId=rec.id;
  }else{
    const sh=shareById(shareId); if(sh) updateRecord('shares',shareId,{profitAlertPct,volumeAlertPct,queueBreakAlert,updatedAt:Date.now()});
  }
  if(!shareId){toast('عرضه اولیه را انتخاب کنید');return;}
  const checks=$$('.b_check:checked'); if(!checks.length){toast('حداقل یک شخص را انتخاب کنید');return;}
  let count=0;
  for(const c of checks){
    const pid=c.dataset.pid,qty=numVal($(`.b_qty_row[data-pid="${pid}"]`))||numVal('#b_qty'),price=numVal($(`.b_price_row[data-pid="${pid}"]`))||numVal('#b_price');
    if(!qty||!price)continue;
    addRecord('purchases',{shareId,personId:pid,quantity:qty,unitPrice:price,date,status:'open',createdAt:Date.now()});count++;
  }
  if(!count){toast('برای هیچ شخصی تعداد/قیمت معتبر وارد نشده');return;}
  closeSheet();toast(`خرید برای ${count} نفر ثبت شد`);
}

function submitSell(){
  const shareId = $('#s_share').value;
  if(!shareId){ toast('عرضه اولیه را انتخاب کنید'); return; }
  const date = isoToTs($('#s_date').value);
  const checks = $$('.s_check:checked');
  if(!checks.length){ toast('حداقل یک ردیف را انتخاب کنید'); return; }
  let count = 0;
  for(const c of checks){
    const lotId = c.dataset.lot;
    const lot = S.purchases.find(p=>p.id===lotId);
    if(!lot) continue;
    const qtyInput = $(`.s_qty_row[data-lot="${lotId}"]`);
    const qty = numVal(qtyInput) || lot.quantity;
    const price = numVal($(`.s_price_row[data-lot="${lotId}"]`)) || numVal('#s_price');
    if(!qty || !price || qty>lot.quantity) { toast('مقدار یا قیمت نامعتبر در یکی از ردیف‌ها'); continue; }

    const saleRec=addRecord('sales', {
      shareId, personId:lot.personId, purchaseId:lot.id,
      quantity:qty, buyPrice:lot.unitPrice, salePrice:price, date, createdAt:Date.now()
    });
    if(qty === lot.quantity){
      updateRecord('purchases', lot.id, {status:'sold', soldAt:date});
    }else{
      updateRecord('purchases', lot.id, {quantity: lot.quantity-qty});
      addRecord('purchases', {
        shareId, personId:lot.personId, quantity:qty, unitPrice:lot.unitPrice,
        date:lot.date, status:'sold', soldAt:date, createdAt:Date.now(), sourceSaleId:saleRec.id
      });
    }
    count++;
  }
  if(!count) return;
  closeSheet(); toast('فروش ثبت شد');
}

function renderHistory(){
  const items = [
    ...S.purchases.map(p=>({...p, kind:'buy', ts:p.date, price:p.unitPrice})),
    ...S.sales.map(s=>({...s, kind:'sell', ts:s.date, price:s.salePrice})),
  ];
  const f = S.filters;
  const filtered = items.filter(it=>{
    if(f.type!=='all' && it.kind!==f.type) return false;
    if(f.status!=='all'){
      if(it.kind==='buy' && it.status!==f.status) return false;
      if(it.kind==='sell' && f.status==='open') return false;
    }
    if(f.q){
      const sh = shareById(it.shareId); const per = personById(it.personId);
      const hay = ((sh?sh.name:'')+' '+(per?per.name:'')).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=> (b.ts||0)-(a.ts||0));

  $('#app').innerHTML = `
    <div class="search-bar">
      <input id="h_search" placeholder="جست‌وجوی شخص یا عرضه اولیه…" value="${escapeAttr(f.q)}">
    </div>
    <div class="chip-row">
      <button class="chip ${f.type==='all'?'active':''}" onclick="setFilter('type','all')">همه</button>
      <button class="chip ${f.type==='buy'?'active':''}" onclick="setFilter('type','buy')">خریدها</button>
      <button class="chip ${f.type==='sell'?'active':''}" onclick="setFilter('type','sell')">فروش‌ها</button>
      <button class="chip ${f.status==='open'?'active':''}" onclick="setFilter('status', f.status==='open'?'all':'open')">فقط باز</button>
    </div>
    ${filtered.length? `<div class="card">${filtered.map(it=>{
      const sh=shareById(it.shareId); const per=personById(it.personId);
      return `<div class="row" style="gap:8px;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:13.5px;">${sh?escapeHtml(sh.name):'—'} · ${per?escapeHtml(per.name):'—'}</div>
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${fmtDate(it.ts)} · ${fmtNum(it.quantity)} واحد × ${fmtNum(it.price)}</div>
        </div>
        <span class="pill ${it.kind==='buy'?'accent':'pos'}">${it.kind==='buy'?'خرید':'فروش'}</span>
        <button class="btn ghost sm" onclick="editHistoryItem('${it.kind}','${it.id}')">ویرایش</button>
        <button class="btn ghost sm" style="color:var(--neg);" onclick="deleteHistoryItem('${it.kind}','${it.id}')">حذف</button>
      </div>`;
    }).join('')}</div>` : emptyBlock('چیزی یافت نشد', 'فیلتر یا عبارت جست‌وجو را تغییر دهید.')}
  `;
  $('#h_search').addEventListener('input', e=>{ S.filters.q=e.target.value; renderHistory(); });
  const el=$('#h_search'); el.focus(); el.selectionStart=el.selectionEnd=el.value.length;
}
function setFilter(k,v){ S.filters[k]=v; renderHistory(); }

function reverseSale(sale){
  const lot=S.purchases.find(p=>p.id===sale.purchaseId);
  if(lot){
    lot.quantity=Number(lot.quantity||0)+Number(sale.quantity||0);
    lot.status='open';
  }
  const split=S.purchases.find(p=>p.sourceSaleId===sale.id);
  if(split) S.purchases=S.purchases.filter(p=>p.id!==split.id);
}
function editHistoryItem(kind,id){
  if(kind==='buy'){
    const p=S.purchases.find(x=>x.id===id); if(!p)return;
    openSheet('ویرایش تراکنش خرید',`<div class="field"><label>تعداد</label><input id="tx_qty" class="num money" inputmode="numeric" value="${fmtInput(p.quantity)}"></div><div class="field"><label>قیمت خرید</label><input id="tx_price" class="num money" inputmode="numeric" value="${fmtInput(p.unitPrice)}"></div><div class="field"><label>تاریخ</label><input id="tx_date_display" class="jalali-date" readonly onclick="openJalaliPicker('tx_date','tx_date_display')"><input id="tx_date" type="hidden" value="${tsToIso(p.date)}"></div><button class="btn block" onclick="saveHistoryEdit('buy','${id}')">ذخیره</button>`);
    initJalaliField('tx_date','tx_date_display');
  }else{
    const s=S.sales.find(x=>x.id===id); if(!s)return;
    openSheet('ویرایش تراکنش فروش',`<div class="field"><label>تعداد فروش</label><input id="tx_qty" class="num money" inputmode="numeric" value="${fmtInput(s.quantity)}"></div><div class="field"><label>قیمت فروش</label><input id="tx_price" class="num money" inputmode="numeric" value="${fmtInput(s.salePrice)}"></div><div class="field"><label>تاریخ</label><input id="tx_date_display" class="jalali-date" readonly onclick="openJalaliPicker('tx_date','tx_date_display')"><input id="tx_date" type="hidden" value="${tsToIso(s.date)}"></div><button class="btn block" onclick="saveHistoryEdit('sell','${id}')">ذخیره</button>`);
    initJalaliField('tx_date','tx_date_display');
  }
}
function saveHistoryEdit(kind,id){
  const qty=numVal('#tx_qty'), price=numVal('#tx_price'), date=isoToTs($('#tx_date').value);
  if(!qty||!price){toast('تعداد و مبلغ را درست وارد کنید');return;}
  if(kind==='buy'){
    const p=S.purchases.find(x=>x.id===id); if(!p)return;
    p.quantity=qty; p.unitPrice=price; p.date=date;
    S.sales.filter(x=>x.purchaseId===id).forEach(x=>x.buyPrice=price);
  }else{
    const s=S.sales.find(x=>x.id===id); if(!s)return;
    reverseSale(s);
    const lot=S.purchases.find(x=>x.id===s.purchaseId);
    if(!lot || qty>Number(lot.quantity||0)){toast('تعداد فروش بیشتر از موجودی است');saveLocal();render();return;}
    s.quantity=qty; s.salePrice=price; s.date=date; s.buyPrice=lot.unitPrice;
    if(qty===lot.quantity) lot.status='sold';
    else {lot.quantity-=qty; const split=Object.assign({id:uid4()+Date.now().toString(36)}, {shareId:s.shareId,personId:s.personId,quantity:qty,unitPrice:lot.unitPrice,date:lot.date,status:'sold',createdAt:Date.now(),sourceSaleId:s.id}); S.purchases.push(split);}
  }
  saveLocal();closeSheet();toast('تراکنش ویرایش شد');render();
}
function deleteHistoryItem(kind,id){
  if(!confirm('این تراکنش حذف شود؟ تغییر آن در سود و زیان و موجودی اعمال می‌شود.'))return;
  if(kind==='buy'){
    const p=S.purchases.find(x=>x.id===id); if(!p)return;
    const related=S.sales.filter(x=>x.purchaseId===id);
    if(related.length){ if(!confirm('این خرید فروش ثبت‌شده مرتبط دارد. با حذف خرید، فروش‌های مرتبط هم حذف شوند؟'))return; related.forEach(x=>{const split=S.purchases.find(p=>p.sourceSaleId===x.id);if(split) S.purchases=S.purchases.filter(p=>p.id!==split.id);}); S.sales=S.sales.filter(x=>x.purchaseId!==id); }
    S.purchases=S.purchases.filter(x=>x.id!==id);
  }else{
    const s=S.sales.find(x=>x.id===id); if(!s)return;
    reverseSale(s); S.sales=S.sales.filter(x=>x.id!==id);
  }
  saveLocal();render();toast('تراکنش حذف شد');
}

let chartRef=null;
function setReportPeriod(v){ S.reportPeriod=v; renderReports(); }
function renderReports(){
  const selected=S.reportPeriod||'all';
  const key=selected==='all'?'all':selected;
  const st=statsForPeriod(key);
  const months=availableReportMonths();
  const perShare=S.shares.map(sh=>{
    const ps=S.purchases.filter(p=>p.shareId===sh.id && (selected==='all' || monthKey(p.date)===selected));
    const ss=S.sales.filter(x=>x.shareId===sh.id && (selected==='all' || monthKey(x.date)===selected));
    const invested=ps.reduce((a,p)=>a+buyCostWithFee(Number(p.quantity||0)*Number(p.unitPrice||0)),0);
    const soldCost=ss.reduce((a,x)=>a+buyCostWithFee(Number(x.quantity||0)*Number(x.buyPrice||0)),0);
    const revenue=ss.reduce((a,x)=>a+netSellValue(Number(x.quantity||0)*Number(x.salePrice||0)),0);
    const profit=revenue-soldCost, profitPct=soldCost>0?profit/soldCost*100:0;
    return {share:sh,stats:{invested,profit,profitPct}};
  }).filter(x=>x.stats.invested||x.stats.profit).sort((a,b)=>b.stats.profit-a.stats.profit);
  $('#app').innerHTML=`
    <div class="section-title">گزارش مالی</div>
    <div class="chip-row">
      <button class="chip ${selected==='all'?'active':''}" onclick="setReportPeriod('all')">کل / تجمعی</button>

    </div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">دوره انتخاب‌شده: <b>${selected==='all'?'کل / تجمعی':monthLabel(selected)}</b></div>
    <div class="stats">
      <div class="stat"><div class="lbl">سرمایه‌گذاری</div><div class="val">${fmtToman(st.invested)}</div></div>
      <div class="stat"><div class="lbl">مجموع فروش</div><div class="val">${fmtToman(st.revenue)}</div></div>
      <div class="stat"><div class="lbl">سود خالص</div><div class="val ${st.profit>=0?'pos':'neg'}">${fmtToman(st.profit)}</div></div>
      <div class="stat"><div class="lbl">درصد سود</div><div class="val ${st.profitPct>=0?'pos':'neg'}">${st.profitPct.toFixed(1)}٪</div></div>
    </div>
    ${renderUnrealizedBlock()}
    <div class="section-title">خلاصه عملکرد به تفکیک عرضه اولیه</div>
    ${perShare.length?`<div class="card" style="padding:4px 10px;overflow:auto;"><table><thead><tr><th>عرضه اولیه</th><th>سرمایه</th><th>سود تجمعی</th><th>درصد</th></tr></thead><tbody>${perShare.map(x=>`<tr><td>${escapeHtml(x.share.name)}</td><td class="num">${fmtNum(x.stats.invested)}</td><td class="num" style="color:${x.stats.profit>=0?'var(--pos)':'var(--neg)'}">${fmtNum(x.stats.profit)}</td><td class="num">${x.stats.profitPct.toFixed(1)}٪</td></tr>`).join('')}</tbody></table></div>`:emptyBlock('داده‌ای برای گزارش نیست','بعد از ثبت اولین خرید و فروش، گزارش کامل می‌شود.')}
  `;
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('اطلاعات فعلی با محتوای این فایل جایگزین شود؟')) return;
      S.people = data.people||[]; S.shares = data.shares||[];
      S.purchases = data.purchases||[]; S.sales = data.sales||[]; S.cashTransactions = data.cashTransactions||[];
      S.apiKey=data.apiKey||S.apiKey||'';
      S.apiEndpoint=data.apiEndpoint||S.apiEndpoint||'https://Api.BrsApi.ir/Tsetmc/AllSymbols.php';
      saveLocal(); closeSheet(); toast('بازیابی شد');
    }catch(e){ toast('فایل معتبر نیست'); }
  };
  reader.readAsText(file);
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* ---------------- JALALI DATE PICKER / CASH LEDGER ---------------- */
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const _jdiv=(a,b)=>Math.trunc(a/b), _jmod=(a,b)=>a-Math.floor(a/b)*b;
const _JBREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function _jalCal(jy, withoutLeap){
  const bl=_JBREAKS.length, gy=jy+621; let leapJ=-14, jp=_JBREAKS[0], jm, jump=0, n, i;
  for(i=1;i<bl;i++){
    jm=_JBREAKS[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ+=_jdiv(jump,33)*8+_jdiv(_jmod(jump,33),4); jp=jm;
  }
  n=jy-jp;
  leapJ+=_jdiv(n,33)*8+_jdiv(_jmod(n,33)+3,4);
  if(_jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  const leapG=_jdiv(gy,4)-_jdiv((_jdiv(gy,100)+1)*3,4)-150;
  const march=20+leapJ-leapG;
  if(withoutLeap) return {gy,march};
  if(jump-n<6) n=n-jump+_jdiv(jump+4,33)*33;
  let leap=_jmod(_jmod(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap,gy,march};
}
function _g2d(gy,gm,gd){
  let d=_jdiv((gy+_jdiv(gm-8,6)+100100)*1461,4)+_jdiv(153*_jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-_jdiv(_jdiv(gy+100100+_jdiv(gm-8,6),100)*3,4)+752; return d;
}
function _d2g(jdn){
  let j=4*jdn+139361631; j=j+_jdiv(_jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=_jdiv(_jmod(j,1461),4)*5+308, gd=_jdiv(_jmod(i,153),5)+1, gm=_jmod(_jdiv(i,153),12)+1, gy=_jdiv(j,1461)-100100+_jdiv(8-gm,6);
  return [gy,gm,gd];
}
function g2j(gy,gm,gd){
  const jdn=_g2d(gy,gm,gd); let jy=_d2g(jdn)[0]-621; const r=_jalCal(jy,false), jdn1f=_g2d(r.gy,3,r.march);
  let k=jdn-jdn1f, jm, jd;
  if(k>=0){ if(k<=185){ return [jy,1+_jdiv(k,31),_jmod(k,31)+1]; } k-=186; }
  else{ jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+_jdiv(k,30); jd=_jmod(k,30)+1; return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  const r=_jalCal(jy,true);
  return _d2g(_g2d(r.gy,3,r.march)+(jm-1)*31-_jdiv(jm,7)*(jm-7)+jd-1);
}
function isJLeap(jy){ return _jalCal(jy,false).leap===0; }
function jDays(y,m){ if(m<=6)return 31; if(m<=11)return 30; return isJLeap(y)?30:29; }
function gregToJString(iso){const [y,m,d]=iso.split('-').map(Number),j=g2j(y,m,d);return `${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')}`;}
function jalaliToIso(y,m,d){const g=j2g(y,m,d);return `${g[0]}-${String(g[1]).padStart(2,'0')}-${String(g[2]).padStart(2,'0')}`;}
function initJalaliField(hiddenId,displayId){const h=$('#'+hiddenId),d=$('#'+displayId);if(!h||!d)return; if(!h.value)h.value=todayInput(); d.value=gregToJString(h.value);}
let JCAL={hy:0,hm:0,hidden:'',display:''};
function openJalaliPicker(hiddenId,displayId){const h=$('#'+hiddenId);if(!h)return;const j=g2j(...h.value.split('-').map(Number));JCAL={hy:j[0],hm:j[1],hidden:hiddenId,display:displayId};renderJalaliPicker();}
function renderJalaliPicker(){
  let ov=$('#jalaliPicker');if(!ov){ov=document.createElement('div');ov.id='jalaliPicker';ov.className='jalali-picker';document.body.appendChild(ov);} const now=g2j(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()); const selected=$('#'+JCAL.hidden)?.value; const sj=selected?g2j(...selected.split('-').map(Number)):[];
  const firstIso=jalaliToIso(JCAL.hy,JCAL.hm,1), wd=(new Date(firstIso+'T00:00:00').getDay()+1)%7; let days=''; for(let i=0;i<wd;i++)days+='<div></div>'; for(let d=1;d<=jDays(JCAL.hy,JCAL.hm);d++){const iso=jalaliToIso(JCAL.hy,JCAL.hm,d);const cls=(JCAL.hy===now[0]&&JCAL.hm===now[1]&&d===now[2]?' today':'')+(sj.length&&JCAL.hy===sj[0]&&JCAL.hm===sj[1]&&d===sj[2]?' selected':'');days+=`<button class="jcal-day${cls}" onclick="pickJalali(${JCAL.hy},${JCAL.hm},${d})">${d}</button>`;}
  ov.innerHTML=`<div class="jcal" onclick="event.stopPropagation()"><div class="jcal-head"><button class="jcal-nav" onclick="moveJalali(-1)">‹</button><div class="jcal-title">${JMONTHS[JCAL.hm-1]} ${JCAL.hy}</div><button class="jcal-nav" onclick="moveJalali(1)">›</button></div><div class="jcal-week"><div>شنبه</div><div>یکشنبه</div><div>دوشنبه</div><div>سه‌شنبه</div><div>چهارشنبه</div><div>پنجشنبه</div><div>جمعه</div></div><div class="jcal-days">${days}</div><div class="jcal-today"><button class="btn secondary" style="flex:1;" onclick="pickToday()">امروز</button><button class="btn secondary" style="flex:1;" onclick="closeJalaliPicker()">انصراف</button></div></div>`;
  ov.onclick=closeJalaliPicker;
}
function moveJalali(n){JCAL.hm+=n;if(JCAL.hm>12){JCAL.hm=1;JCAL.hy++;}if(JCAL.hm<1){JCAL.hm=12;JCAL.hy--;}renderJalaliPicker();}
function pickJalali(y,m,d){const iso=jalaliToIso(y,m,d),h=$('#'+JCAL.hidden),disp=$('#'+JCAL.display);if(h)h.value=iso;if(disp)disp.value=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;closeJalaliPicker();}
function pickToday(){const n=new Date(),j=g2j(n.getFullYear(),n.getMonth()+1,n.getDate());pickJalali(j[0],j[1],j[2]);}
function closeJalaliPicker(){const ov=$('#jalaliPicker');if(ov)ov.remove();}
function copyText(v){const t=String(v||'').replace(/\s/g,'');if(!t)return;navigator.clipboard?.writeText(t).then(()=>toast('شماره کارت کپی شد')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('شماره کارت کپی شد');});}
function cashForPerson(pid){let cash=0;S.cashTransactions.forEach(x=>{if(x.personId===pid)cash+=(x.type==='deposit'?1:-1)*Number(x.amount||0);});S.purchases.filter(x=>x.personId===pid).forEach(x=>cash-=Number(x.quantity||0)*Number(x.unitPrice||0));S.sales.filter(x=>x.personId===pid).forEach(x=>cash+=Number(x.quantity||0)*Number(x.salePrice||0));return cash;}
function sharesValueForPerson(pid){return S.purchases.filter(x=>x.personId===pid&&x.status==='open').reduce((a,x)=>{const sh=shareById(x.shareId);return a+netSellValue(Number(x.quantity||0)*Number(sh?.currentPrice||x.unitPrice||0));},0);}
function personBalance(pid){const cash=cashForPerson(pid),shares=sharesValueForPerson(pid),total=cash+shares,net=S.cashTransactions.filter(x=>x.personId===pid).reduce((a,x)=>a+(x.type==='deposit'?1:-1)*Number(x.amount||0),0),pl=total-net;return {cash,shares,total,pl,net};}
function openCashForm(){
 if(!S.people.length){toast('اول باید حداقل یک شخص ثبت کنید');return;}
 openSheet('ثبت واریز / برداشت',`<div class="field-row"><div class="field"><label>نوع عملیات</label><select id="c_type"><option value="deposit">واریز</option><option value="withdraw">برداشت</option></select></div><div class="field"><label>تاریخ</label><input id="c_date_display" class="jalali-date" readonly onclick="openJalaliPicker('c_date','c_date_display')"><input id="c_date" type="hidden" value="${todayInput()}"></div></div><div class="field"><label>مبلغ یکسان برای همه (ریال)</label><input id="c_amount" class="num money" inputmode="numeric" oninput="applyCashMaster()" placeholder="مثلاً 10,000,000"></div><div class="field"><label>اشخاص</label><div class="card" style="padding:6px 10px;overflow:auto;"><table><thead><tr><th></th><th>شخص</th><th>مبلغ</th></tr></thead><tbody>${S.people.map(p=>`<tr><td><input type="checkbox" class="c_check" data-pid="${p.id}" checked></td><td>${escapeHtml(p.name)}</td><td><input class="price-input num c_amount_row money" data-pid="${p.id}" inputmode="numeric" placeholder="—"></td></tr>`).join('')}</tbody></table></div></div><div class="hint">مبلغ اصلی برای همه اعمال می‌شود؛ در هر ردیف می‌توانید مبلغ همان شخص را تغییر دهید.</div><button class="btn block" onclick="submitCash()">ثبت عملیات</button>`);initJalaliField('c_date','c_date_display');
}
function applyCashMaster(){const v=$('#c_amount')?.value;if(v)$$('.c_amount_row').forEach(x=>{if(!x.dataset.touched)x.value=v;});}
document.addEventListener('input',e=>{if(e.target.classList?.contains('c_amount_row'))e.target.dataset.touched='1';});
function submitCash(){const type=$('#c_type').value,date=isoToTs($('#c_date').value),checks=$$('.c_check:checked');let count=0;for(const c of checks){const amount=numVal($(`.c_amount_row[data-pid="${c.dataset.pid}"]`))||numVal('#c_amount');if(!amount||amount<0)continue;addRecord('cashTransactions',{personId:c.dataset.pid,type,amount,date,createdAt:Date.now()});count++;}if(!count){toast('برای هیچ شخصی مبلغ معتبر وارد نشده');return;}closeSheet();toast(`${type==='deposit'?'واریز':'برداشت'} برای ${count} نفر ثبت شد`);}
function renderCash(){
 const totals=S.people.reduce((a,p)=>{const b=personBalance(p.id);a.cash+=b.cash;a.shares+=b.shares;a.total+=b.total;return a;},{cash:0,shares:0,total:0});
 $('#app').innerHTML=`<div class="section-title">موجودی اشخاص</div><div class="cash-summary"><div class="stat"><div class="lbl">نقدینگی</div><div class="val">${fmtToman(totals.cash)}</div></div><div class="stat"><div class="lbl">ارزش سهام</div><div class="val">${fmtToman(totals.shares)}</div></div><div class="stat"><div class="lbl">کل موجودی</div><div class="val">${fmtToman(totals.total)}</div></div></div><div class="refresh-row"><div class="section-title" style="margin:0;">تفکیک اشخاص</div><button class="btn secondary sm" onclick="openCashForm()">ثبت جدید</button></div><div class="card" style="padding:4px 10px;overflow:auto;"><table><thead><tr><th>شخص</th><th>نقدینگی</th><th>سهام</th><th>کل</th><th>سود/زیان</th></tr></thead><tbody>${S.people.map(p=>{const b=personBalance(p.id);return `<tr><td>${escapeHtml(p.name)}</td><td class="num">${fmtNum(b.cash)}</td><td class="num">${fmtNum(b.shares)}</td><td class="num"><b>${fmtNum(b.total)}</b></td><td class="num" style="color:${b.pl>=0?'var(--pos)':'var(--neg)'}">${fmtNum(b.pl)}</td></tr>`;}).join('')}</tbody></table></div><div class="section-title">آخرین واریز و برداشت</div>${S.cashTransactions.length?`<div class="card" style="padding:4px 10px;overflow:auto;"><table><thead><tr><th>شخص</th><th>نوع</th><th>مبلغ</th><th>تاریخ</th></tr></thead><tbody>${[...S.cashTransactions].sort((a,b)=>(b.date||0)-(a.date||0)).map(x=>{const p=personById(x.personId);return `<tr><td>${p?escapeHtml(p.name):'—'}</td><td><span class="pill ${x.type==='deposit'?'pos':'neg'}">${x.type==='deposit'?'واریز':'برداشت'}</span></td><td class="num">${fmtNum(x.amount)}</td><td>${fmtDate(x.date)}</td></tr>`}).join('')}</tbody></table></div>`:emptyBlock('هنوز تراکنش نقدی ثبت نشده','برای ثبت گروهی واریز یا برداشت روی «ثبت جدید» بزنید.')}`;
}

/* ---------------- theme (روز / شب) ---------------- */
function effectiveTheme(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t==='dark'||t==='light') return t;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function syncThemeColor(){
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', effectiveTheme()==='dark' ? '#12160F' : '#EEF0EA');
}
function toggleTheme(){
  const next = effectiveTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('sahm_theme', next); }catch(e){}
  syncThemeColor();
  toast(next==='dark' ? 'حالت شب فعال شد' : 'حالت روز فعال شد');
}
syncThemeColor();
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor); }catch(e){}

/* ---------------- money inputs: جداکننده سه‌رقمی ---------------- */
function numVal(elOrSel){
  const el = typeof elOrSel==='string' ? $(elOrSel) : elOrSel;
  if(!el) return 0;
  const n = Number(normalizeDigits(el.value).replace(/[^0-9.]/g,''));
  return isNaN(n) ? 0 : n;
}
function fmtInput(n){ return (n===null||n===undefined||n===''||isNaN(Number(n))) ? '' : Number(n).toLocaleString('en-US',{maximumFractionDigits:6}); }
document.addEventListener('input', e=>{
  const el=e.target;
  if(!el.classList || !el.classList.contains('money')) return;
  const raw = normalizeDigits(el.value);
  const caret = el.selectionStart==null ? raw.length : el.selectionStart;
  const digitsBefore = raw.slice(0,caret).replace(/[^0-9]/g,'').length;
  const digits = raw.replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
  const out = digits ? Number(digits).toLocaleString('en-US') : '';
  // اعداد خیلی بزرگ (بیش از ۱۵ رقم) را بدون تبدیل عددی فرمت می‌کنیم
  const fin = digits.length>15 ? digits.replace(/\B(?=(\d{3})+(?!\d))/g,',') : out;
  if(fin===el.value) return;
  el.value = fin;
  // بازگرداندن مکان نشانگر
  let pos=0, seen=0;
  while(pos<fin.length && seen<digitsBefore){ if(/\d/.test(fin[pos])) seen++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(_){}
});

setupAutoRefresh();
